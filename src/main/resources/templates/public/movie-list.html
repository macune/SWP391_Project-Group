<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: master(
          title = ~{::title},
          sidebar = ~{},
          content = ~{::#public-content},
          actorCss = ~{::link},
          actorJs = ~{}
      )}">
<head>
    <title>CineFlow | Mua Vé Xem Phim</title>
    <!-- Custom CSS cho riêng Public (nếu có), ở đây dùng common.css là đủ -->
    <link rel="stylesheet" href="">
</head>
<body>

<div id="public-content" class="container py-4">

    <!-- Thanh Tìm Kiếm -->
    <div class="row justify-content-center mb-5">
        <div class="col-md-8">
            <form th:action="@{/movies}" method="get" class="d-flex shadow-sm rounded">
                <input type="text" name="search" th:value="${keyword}" class="form-control form-control-lg border-cine border-end-0" placeholder="🔍 Tìm kiếm tên phim...">
                <button type="submit" class="btn btn-cine btn-lg rounded-end">Tìm Kiếm</button>
            </form>
        </div>
    </div>

    <!-- Tiêu đề (Đang chiếu / Kết quả) -->
    <h3 class="fw-bold text-cine-main border-bottom border-cine pb-2 mb-4">
        <i class="fa-solid fa-film text-cine-primary me-2"></i><span th:text="${pageTitle}">Phim Đang Chiếu</span>
    </h3>

    <!-- Danh Sách Phim -->
    <div class="row g-4 mb-5">
        <div class="col-12 text-center text-cine-pastel py-5" th:if="${#lists.isEmpty(movies)}">
            <h5>Không tìm thấy phim nào phù hợp!</h5>
        </div>

        <div class="col-md-3 col-sm-6" th:each="m : ${movies}">
            <div class="card h-100 border-cine shadow-sm movie-card">
                <a th:href="@{/movies/{id}(id=${m.movieId})}" class="text-decoration-none">
                    <img th:src="${m.posterUrl != null ? m.posterUrl : '/img/default-poster.jpg'}" class="card-img-top" th:alt="${m.title}" style="height: 350px; object-fit: cover;">
                </a>
                <div class="card-body d-flex flex-column bg-cine-main">
                    <h5 class="card-title text-cine-main fw-bold" th:text="${m.title}">Tên Phim</h5>
                    <div class="mb-2">
                        <span class="badge bg-cine-primary me-1" th:text="${m.ageRating}">C18</span>
                        <span class="badge bg-cine-dark text-cine-text-main border border-cine" th:text="${m.genre}">Hành động</span>
                    </div>
                    <p class="card-text text-cine-muted small flex-grow-1"><i class="fa-regular fa-clock me-1"></i><span th:text="${m.duration} + ' phút'"></span></p>
                    <a th:href="@{/movies/{id}(id=${m.movieId})}" class="btn btn-outline-cine w-100 fw-bold mt-auto">
                        <i class="fa-solid fa-ticket me-1"></i> Mua Vé
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Phim Sắp Chiếu (Chỉ hiện nếu đang ở trang chủ, không phải lúc Search) -->
    <th:block th:if="${keyword == null and not #lists.isEmpty(comingSoonMovies)}">
        <h3 class="fw-bold text-cine-muted border-bottom border-cine pb-2 mb-4 mt-5">
            <i class="fa-solid fa-calendar-days text-cine-primary me-2"></i>Phim Sắp Chiếu
        </h3>
        <div class="row g-4">
            <div class="col-md-3 col-sm-6" th:each="m : ${comingSoonMovies}">
                <div class="card h-100 border-cine shadow-sm opacity-75">
                    <img th:src="${m.posterUrl != null ? m.posterUrl : '/img/default-poster.jpg'}" class="card-img-top" th:alt="${m.title}" style="height: 350px; object-fit: cover;">
                    <div class="card-body bg-cine-frame">
                        <h6 class="card-title text-cine-main fw-bold" th:text="${m.title}">Tên Phim</h6>
                        <p class="small text-cine-hot fw-bold mb-0">Dự kiến: <span th:text="${#temporals.format(m.releaseDate, 'dd/MM/yyyy')}"></span></p>
                    </div>
                </div>
            </div>
        </div>
    </th:block>

</div>
</body>
</html>
