<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/layout :: master(
          title = ~{::title},
          sidebar = ~{layout/sidebar :: customer-sidebar},
          content = ~{::#page-content},
          actorCss = ~{::link},
          actorJs = ~{}
      )}">
<head>
    <title>Đổi mật khẩu bảo mật | CineFlow</title>
    <link rel="stylesheet" th:href="@{/css/customer.css}">
</head>
<body>

<div id="page-content" class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <div>
            <h4 class="fw-bold mb-1 text-cine-primary">
                <i class="fa-solid fa-key me-2"></i>Đổi mật khẩu bảo mật
            </h4>
            <p class="small text-muted mb-0">
                Để bảo vệ tài khoản, vui lòng không chia sẻ mật khẩu cho người khác.
            </p>
        </div>
    </div>

    <!-- Thông báo kết quả -->
    <div th:if="${successMessage}" class="alert bg-cine-soft border-cine alert-dismissible fade show mb-4" role="alert">
        <i class="fa-solid fa-circle-check me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert bg-cine-hot text-white alert-dismissible fade show mb-4" role="alert">
        <i class="fa-solid fa-triangle-exclamation me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Form đổi mật khẩu -->
    <div class="row">
        <div class="col-lg-6 col-md-8 col-12">
            <div class="card border-cine shadow-sm bg-white p-4">
                <form th:action="@{/customer/change-password}" th:object="${changePasswordRequest}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-medium">Mật khẩu hiện tại <span class="text-danger">*</span></label>
                        <input type="password" th:field="*{oldPassword}"
                               class="form-control border-cine"
                               th:classappend="${#fields.hasErrors('oldPassword')} ? 'is-invalid' : ''"
                               placeholder="Nhập mật khẩu hiện tại của bạn..." required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('oldPassword')}" th:errors="*{oldPassword}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-medium">Mật khẩu mới <span class="text-danger">*</span></label>
                        <input type="password" th:field="*{newPassword}"
                               class="form-control border-cine"
                               th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid' : ''"
                               placeholder="Nhập mật khẩu mới (từ 6 đến 32 ký tự)..." required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                        <div class="form-text small text-muted">Mật khẩu mới phải từ 6 đến 32 ký tự.</div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-medium">Xác nhận mật khẩu mới <span class="text-danger">*</span></label>
                        <input type="password" th:field="*{confirmPassword}"
                               class="form-control border-cine"
                               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                               placeholder="Nhập lại mật khẩu mới..." required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                    </div>

                    <div class="d-flex align-items-center gap-2">
                        <button type="submit" class="btn btn-cine px-4 py-2">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Lưu thay đổi
                        </button>
                        <a th:href="@{/customer/dashboard}" class="btn btn-outline-secondary px-3 py-2">
                            Quay lại
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
