<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: master(
          title = ~{::title},
          sidebar = ~{layout/sidebar :: sidebar},
          content = ~{::#page-content},
          actorCss = ~{::#dummy-css},
          actorJs = ~{::#dummy-js}
      )}">
<head>
    <title>Chọn Bắp Nước | CineFlow</title>
</head>
<body>

<div id="page-content" class="container-fluid mt-4">
    <h4 class="mb-4 fw-bold text-cine-primary">Thêm Bắp Nước (F&B)</h4>

    <div class="row">
        <!-- BÊN TRÁI: DANH SÁCH MÓN ĂN -->
        <div class="col-md-8">
            <div class="row">
                <div class="col-md-4 mb-4" th:each="item : ${fnbList}">
                    <div class="card shadow-sm border-cine h-100">
                        <img th:src="${item.imageUrl != null and item.imageUrl != '' ? item.imageUrl : '/images/default-fnb.png'}"
                             class="card-img-top" alt="F&B Image" style="height: 200px; object-fit: cover;">

                        <div class="card-body d-flex flex-column text-center">
                            <h6 class="card-title fw-bold" th:text="${item.name}">Tên Món</h6>
                            <p class="card-text text-danger fw-bold mb-3 fs-5"
                               th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></p>

                            <!-- DÙNG FORM ĐỂ GỬI DỮ LIỆU THÊM MÓN -->
                            <form th:action="@{/customer/booking/add}" method="post" class="mt-auto">
                                <input type="hidden" name="bookingId" th:value="${bookingId}" />
                                <input type="hidden" name="itemId" th:value="${item.id}" />

                                <div class="input-group mb-2 justify-content-center">
                                    <button class="btn btn-outline-secondary" type="button" onclick="this.nextElementSibling.stepDown()">-</button>
                                    <input type="number" name="quantity" class="form-control text-center fw-bold" style="max-width: 60px;" value="1" min="1">
                                    <button class="btn btn-outline-secondary" type="button" onclick="this.previousElementSibling.stepUp()">+</button>
                                </div>

                                <button type="submit" class="btn btn-cine w-100 fw-bold text-white" style="background-color: #e50914;">
                                    <i class="fa-solid fa-cart-plus me-1"></i> Thêm
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(fnbList)}" class="col-12 text-center text-muted py-5">
                    <i class="fa-solid fa-box-open fs-1 mb-3"></i>
                    <p>Hiện tại không có bắp nước nào đang được bán.</p>
                </div>
            </div>
        </div>

        <!-- BÊN PHẢI: GIỎ HÀNG -->
        <div class="col-md-4">
            <div class="card shadow-sm border-cine sticky-top" style="top: 20px;">
                <div class="card-header text-white d-flex justify-content-between align-items-center" style="background-color: #222;">
                    <h6 class="mb-0 fw-bold"><i class="fa-solid fa-basket-shopping me-2"></i> Giỏ Hàng</h6>
                    <span class="badge bg-danger" th:text="${cartItems != null ? #lists.size(cartItems) : 0} + ' món'"></span>
                </div>

                <div class="card-body p-0">
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item px-3 py-3" th:each="cartItem : ${cartItems}">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <div>
                                    <h6 class="mb-0 fw-bold text-cine-primary" th:text="${cartItem.fnbItem.name}">Tên Bắp</h6>
                                    <small class="text-muted" th:text="${cartItem.quantity} + ' x ' + ${#numbers.formatDecimal(cartItem.pricePerItem, 0, 'COMMA', 0, 'POINT')} + ' đ'"></small>
                                </div>
                                <span class="fw-bold text-danger" th:text="${#numbers.formatDecimal(cartItem.subtotal, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                            </div>

                            <div class="d-flex justify-content-between align-items-center">
                                <!-- FORM CẬP NHẬT SỐ LƯỢNG -->
                                <form th:action="@{/customer/booking/update}" method="post" class="d-flex align-items-center">
                                    <input type="hidden" name="bookingId" th:value="${bookingId}" />
                                    <input type="hidden" name="bookingFnbId" th:value="${cartItem.bookingFnbId}" />
                                    <div class="input-group input-group-sm" style="max-width: 100px;">
                                        <input type="number" name="quantity" class="form-control text-center px-1" th:value="${cartItem.quantity}" min="0">
                                        <button type="submit" class="btn btn-outline-secondary px-2" title="Cập nhật">
                                            <i class="fa-solid fa-rotate"></i>
                                        </button>
                                    </div>
                                </form>

                                <!-- FORM XÓA MÓN -->
                                <form th:action="@{/customer/booking/remove}" method="post">
                                    <input type="hidden" name="bookingId" th:value="${bookingId}" />
                                    <input type="hidden" name="bookingFnbId" th:value="${cartItem.bookingFnbId}" />
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa" onclick="return confirm('Bạn có chắc chắn muốn xóa món này?');">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </li>

                        <li class="list-group-item text-center py-4 text-muted" th:if="${cartItems == null or #lists.isEmpty(cartItems)}">
                            Chưa có món nào trong giỏ.
                        </li>
                    </ul>
                </div>

                <div class="card-footer bg-light">
                    <div class="d-flex justify-content-between mb-3">
                        <h6 class="mb-0 fw-bold">Tổng tiền bắp nước:</h6>
                        <h5 class="mb-0 fw-bold text-danger" th:text="${totalAmount != null ? #numbers.formatDecimal(totalAmount, 0, 'COMMA', 0, 'POINT') : 0} + ' đ'">0 đ</h5>
                    </div>

                    <a th:href="@{/booking/review(bookingId=${bookingId})}" class="btn w-100 fw-bold py-2 btn-success">
                        Tiếp tục <i class="fa-solid fa-arrow-right ms-1"></i>
                    </a>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block id="dummy-css"></th:block>
<th:block id="dummy-js"></th:block>

</body>
</html>
