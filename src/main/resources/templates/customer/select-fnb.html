<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: master(title = ~{::title}, sidebar = ~{layout/sidebar :: customer-sidebar}, content = ~{::#page-content}, actorCss = ~{::#dummy-css}, actorJs = ~{::#dummy-js})}">
<head><title>Chọn Đồ ăn & Thức uống | CineFlow</title></head>
<body>
<div id="page-content" class="container-fluid mt-4">
    <h4 class="mb-4 fw-bold text-cine-primary">Thêm Đồ ăn & Thức uống (F&B)</h4>
    <div class="row g-4">
        <div class="col-md-8">
            <div class="card border-0 shadow-sm p-4">
                <h5 class="fw-bold text-cine-primary mb-4 border-bottom pb-2"><i class="fa-solid fa-burger me-2"></i>Menu Đồ ăn & Thức uống</h5>
                <div class="row row-cols-1 row-cols-md-3 g-3">
                    <div class="col" th:each="item : ${fnbList}">
                        <div class="card h-100 border-cine shadow-sm rounded-3">
                            <div class="bg-light d-flex align-items-center justify-content-center border-bottom" style="height: 120px;">
                                <img th:if="${item.imageUrl != null and !item.imageUrl.isEmpty()}" th:src="${item.imageUrl}" class="img-fluid" style="max-height: 100px; object-fit: contain;" />
                                <i th:unless="${item.imageUrl != null and !item.imageUrl.isEmpty()}" class="fa-solid fa-utensils text-secondary fs-1 opacity-50"></i>
                            </div>
                            <div class="card-body p-3 text-center d-flex flex-column">
                                <h6 class="card-title fw-bold text-dark mb-1 fs-6" th:text="${item.name}">Tên món</h6>
                                <p class="card-text text-danger fw-bold mb-3 fs-5" th:text="${item.price != null ? #numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT') : 0} + ' đ'"></p>

                                <form th:action="@{/customer/booking/add}" method="post" class="mt-auto">
                                    <input type="hidden" name="bookingId" th:value="${bookingId}" />
                                    <input type="hidden" name="itemId" th:value="${item.id}" />
                                    <div class="input-group input-group-sm mb-2 justify-content-center">
                                        <button class="btn btn-outline-secondary" type="button" onclick="this.nextElementSibling.stepDown()">-</button>
                                        <input type="number" name="quantity" class="form-control text-center fw-bold" style="max-width: 50px;" value="1" min="1" th:max="${stockQuantityMap.containsKey(item.id) ? stockQuantityMap.get(item.id) : 0}" />
                                        <button class="btn btn-outline-secondary" type="button" onclick="this.previousElementSibling.stepUp()">+</button>
                                    </div>
                                    <button type="submit" class="btn btn-sm btn-cine w-100 fw-bold shadow-sm text-white" style="background-color: #e50914;" th:disabled="${!stockQuantityMap.containsKey(item.id) or stockQuantityMap.get(item.id) le 0}">
                                        <i class="fa-solid fa-plus me-1"></i>Thêm
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card border-0 shadow-sm p-4 d-flex flex-column" style="height: fit-content; min-height: 400px;">
                <h6 class="fw-bold text-cine-primary mb-3">Hóa Đơn Tạm Tính</h6>
                <div class="flex-grow-1 mb-3" style="max-height: 250px; overflow-y: auto;">
                    <p th:if="${cartItems == null or #lists.isEmpty(cartItems)}" class="small text-muted text-center my-4">Chưa có đồ ăn, thức uống nào được chọn.</p>
                    <ul class="list-group list-group-flush" th:unless="${cartItems == null or #lists.isEmpty(cartItems)}">
                        <li class="list-group-item px-0 py-2" th:each="cartItem : ${cartItems}">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h6 class="mb-0 fw-bold text-dark fs-6" th:text="${cartItem != null and cartItem.fnbItem != null ? cartItem.fnbItem.name : 'Món ăn'}">Tên Bắp</h6>
                                <div class="fw-bold text-danger" th:text="${cartItem != null and cartItem.subtotal != null ? #numbers.formatDecimal(cartItem.subtotal, 0, 'COMMA', 0, 'POINT') : 0} + ' đ'"></div>
                            </div>
                            <div class="d-flex justify-content-between align-items-center" th:if="${cartItem != null}">
                                <form th:action="@{/customer/booking/update}" method="post" class="d-flex align-items-center">
                                    <input type="hidden" name="bookingId" th:value="${bookingId}" />
                                    <!-- ID CHUẨN ĐỂ KHÔNG SẬP 500 -->
                                    <input type="hidden" name="bookingFnbId" th:value="${cartItem.bookingFnbId}" />
                                    <div class="input-group input-group-sm" style="max-width: 90px;">
                                        <input type="number" name="quantity" class="form-control text-center px-1 py-0" th:value="${cartItem.quantity}" min="0" />
                                        <button type="submit" class="btn btn-outline-secondary px-2 py-0" title="Cập nhật"><i class="fa-solid fa-rotate fa-xs"></i></button>
                                    </div>
                                </form>
                                <form th:action="@{/customer/booking/remove}" method="post">
                                    <input type="hidden" name="bookingId" th:value="${bookingId}" />
                                    <input type="hidden" name="bookingFnbId" th:value="${cartItem.bookingFnbId}" />
                                    <button type="submit" class="btn btn-sm btn-outline-danger py-0 px-1" title="Xóa"><i class="fa-solid fa-trash fa-xs"></i></button>
                                </form>
                            </div>
                        </li>
                    </ul>
                </div>

                <div class="mt-auto">
                    <hr/>
                    <div class="d-flex justify-content-between fw-bold mb-3 fs-5">
                        <span>Tổng cộng:</span>
                        <span class="text-danger" th:text="${totalAmount != null ? #numbers.formatDecimal(totalAmount, 0, 'COMMA', 0, 'POINT') : 0} + ' đ'">0 đ</span>
                    </div>

                    <a th:href="@{/booking/review(bookingId=${bookingId})}" class="btn w-100 fw-bold fs-6 text-white py-2" style="background-color: #198754;">
                        Trở lại Hóa Đơn <i class="fa-solid fa-arrow-right ms-1"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
<th:block id="dummy-css"></th:block><th:block id="dummy-js"></th:block>
</body></html>
