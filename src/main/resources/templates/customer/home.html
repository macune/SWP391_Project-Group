<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: master(
          title = ~{::title},
          sidebar = ~{},
          content = ~{::#page-content},
          actorCss = ~{::link},
          actorJs = ~{::script}
      )}">
<head>
    <title>Đặt vé xem phim trực tuyến | CineFlow</title>
    <link rel="stylesheet" th:href="@{/css/customer.css}">
</head>
<body>

<div id="page-content" class="container">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <h4 class="fw-bold text-uppercase mb-0">
            <i class="fa-solid fa-heart text-cine-primary me-2"></i>Phim Đang Chiếu Tại CineFlow
        </h4>
        <span class="badge bg-cine-soft px-3 py-2">Toàn hệ thống</span>
    </div>

    <div class="row row-cols-1 row-cols-md-4 g-4">
        <div class="col">
            <div class="card h-100 border-0 shadow-sm">
                <img th:src="@{/images/posters/dune-2.jpg}" class="card-img-top movie-poster-card" alt="Poster">
                <div class="card-body d-flex flex-column">
                    <h6 class="card-title fw-bold">Dune: Hành Tinh Cát 2</h6>
                    <p class="small text-muted mb-3">166 phút | <span class="badge bg-cine-hot">T16</span></p>
                    <a href="#" class="btn btn-cine btn-sm mt-auto w-100">
                        <i class="fa-solid fa-ticket me-1"></i>Mua Vé Ngay
                    </a>
                </div>
            </div>
        </div>

        <div class="col">
            <div class="card h-100 border-0 shadow-sm">
                <img th:src="@{/images/posters/lat-mat-7.jpg}" class="card-img-top movie-poster-card" alt="Poster">
                <div class="card-body d-flex flex-column">
                    <h6 class="card-title fw-bold">Lật Mặt 7: Một Điều Ước</h6>
                    <p class="small text-muted mb-3">138 phút | <span class="badge bg-cine-soft">Phổ biến (K)</span></p>
                    <a href="#" class="btn btn-cine btn-sm mt-auto w-100">
                        <i class="fa-solid fa-ticket me-1"></i>Mua Vé Ngay
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/customer.js}"></script>
</body>
</html>
