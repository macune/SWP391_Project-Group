<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Phim Mới | CineFlow</title>
    <!-- Bootstrap 5 & FontAwesome CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        .bg-cine-dark { background-color: #1a1a1d !important; }
        .text-cine-primary { color: #e50914 !important; }
        .text-cine-pastel { color: #cccccc !important; }
        .border-cine { border-color: #333333 !important; }
        .btn-cine { background-color: #e50914; color: white; border: none; }
        .btn-cine:hover { background-color: #b20710; color: white; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100 bg-dark text-light">

<!-- HEADER -->
<header class="navbar navbar-expand-lg bg-cine-dark sticky-top shadow-sm border-bottom border-cine">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold text-cine-primary fs-4" th:href="@{/movies}">
            <i class="fa-solid fa-clapperboard me-2"></i>Cine<span class="text-cine-pastel">Flow</span>
        </a>
        <div class="d-flex align-items-center gap-3 ms-auto">
            <a th:href="@{/login}" class="btn btn-cine btn-sm text-nowrap px-3">
                <i class="fa-regular fa-user me-1"></i>Đăng nhập
            </a>
        </div>
    </div>
</header>

<!-- CONTENT -->
<main class="flex-grow-1 p-4 container-fluid">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <a th:href="@{/movies}" class="text-decoration-none text-cine-pastel mb-3 d-inline-block">
                <i class="fa-solid fa-arrow-left me-2"></i>Quay lại danh sách
            </a>

            <div class="card bg-dark border-secondary shadow-lg">
                <div class="card-header border-secondary bg-cine-dark py-3">
                    <h4 class="mb-0 text-cine-primary fw-bold"><i class="fa-solid fa-film me-2"></i>Thêm Phim Mới</h4>
                </div>
                <div class="card-body p-4 text-light">
                    <form th:action="@{/movies/add}" th:object="${movieRequest}" method="POST">

                        <div class="row mb-3">
                            <div class="col-md-8">
                                <label class="form-label text-cine-pastel fw-medium">Tên phim <span class="text-danger">*</span></label>
                                <input type="text" class="form-control bg-secondary text-light border-secondary" th:field="*{title}" required />
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-cine-pastel fw-medium">Ngày khởi chiếu <span class="text-danger">*</span></label>
                                <input type="date" class="form-control bg-secondary text-light border-secondary" th:field="*{releaseDate}" required />
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-5">
                                <label class="form-label text-cine-pastel fw-medium">Thể loại <span class="text-danger">*</span></label>
                                <input type="text" class="form-control bg-secondary text-light border-secondary" th:field="*{genre}" placeholder="Hành động, Hài..." required />
                            </div>
                            <div class="col-md-5">
                                <label class="form-label text-cine-pastel fw-medium">Ngôn ngữ <span class="text-danger">*</span></label>
                                <input type="text" class="form-control bg-secondary text-light border-secondary" th:field="*{language}" placeholder="Tiếng Anh - Phụ đề TV" required />
                            </div>
                            <div class="col-md-2">
                                <label class="form-label text-cine-pastel fw-medium">Thời lượng <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <input type="number" class="form-control bg-secondary text-light border-secondary" th:field="*{duration}" required />
                                </div>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label text-cine-pastel fw-medium">Nhãn độ tuổi <span class="text-danger">*</span></label>
                                <select class="form-select bg-secondary text-light border-secondary" th:field="*{ageRating}">
                                    <option value="P">P - Phổ biến</option>
                                    <option value="T13">T13 - Từ 13 tuổi</option>
                                    <option value="T16">T16 - Từ 16 tuổi</option>
                                    <option value="T18">T18 - Từ 18 tuổi</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-cine-pastel fw-medium">Trạng thái <span class="text-danger">*</span></label>
                                <select class="form-select bg-secondary text-light border-secondary" th:field="*{status}">
                                    <option value="COMING_SOON">Sắp chiếu</option>
                                    <option value="NOW_SHOWING">Đang chiếu</option>
                                    <option value="ENDED">Ngừng chiếu</option>
                                </select>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label text-cine-pastel fw-medium">Link Ảnh Poster</label>
                                <input type="text" class="form-control bg-secondary text-light border-secondary" th:field="*{posterUrl}" />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-cine-pastel fw-medium">Link Trailer</label>
                                <input type="text" class="form-control bg-secondary text-light border-secondary" th:field="*{trailerUrl}" />
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-cine-pastel fw-medium">Mô tả nội dung</label>
                            <textarea class="form-control bg-secondary text-light border-secondary" th:field="*{description}" rows="4"></textarea>
                        </div>

                        <div class="text-end border-top border-secondary pt-3">
                            <a th:href="@{/movies}" class="btn btn-outline-secondary me-2 px-4">Hủy</a>
                            <button type="submit" class="btn btn-cine px-5 fw-bold"><i class="fa-solid fa-floppy-disk me-2"></i>Lưu Phim</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- FOOTER -->
<footer class="bg-cine-dark text-light py-4 mt-auto border-top border-cine">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-6">
                <h6 class="fw-bold mb-1">
                    <i class="fa-solid fa-clapperboard text-cine-primary me-2"></i>
                    <span class="text-cine-primary">CINE</span><span class="text-white">FLOW</span> CINEMA SYSTEM
                </h6>
                <p class="small text-cine-pastel opacity-75 mb-0">Trải nghiệm điện ảnh sắc hồng — Hệ thống quản lý đa chi nhánh.</p>
            </div>
            <div class="col-md-6 text-md-end mt-3 mt-md-0">
                <span class="small text-cine-pastel opacity-75">&copy; 2026 CineFlow Management System.</span>
            </div>
        </div>
    </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
