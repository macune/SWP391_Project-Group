<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: master(
          title = ~{::title},
          sidebar = ~{},
          content = ~{::#page-content},
          actorCss = ~{},
          actorJs = ~{}
      )}">
<head>
    <title>Quên mật khẩu | CineFlow</title>
</head>
<body>

<div id="page-content" class="container py-5">
    <div class="card shadow-sm border-0 mx-auto auth-card">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="fa-solid fa-key fs-2 text-cine-primary mb-2"></i>
                <h4 class="fw-bold mb-1">QUÊN MẬT KHẨU</h4>
                <p class="small text-muted">Nhập email tài khoản để nhận liên kết đặt lại mật khẩu</p>
            </div>

            <!-- Thông báo gửi email thành công -->
            <div class="alert alert-success py-2 mb-3 small" th:if="${successMessage}" th:text="${successMessage}"></div>

            <!-- Thông báo lỗi khi tài khoản không hợp lệ -->
            <div class="alert alert-danger py-2 mb-3 small" th:if="${errorMessage}" th:text="${errorMessage}"></div>

            <form th:action="@{/forgot-password}" th:object="${forgotPasswordRequest}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-medium">Email đã đăng ký <span class="text-danger">*</span></label>
                    <input type="email" th:field="*{email}" class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                           placeholder="Nhập email của bạn..." required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <button type="submit" class="btn btn-cine w-100 mt-2 py-2">
                    <i class="fa-solid fa-paper-plane me-1"></i>Gửi liên kết đặt lại mật khẩu
                </button>

                <div class="text-center mt-3">
                    <a th:href="@{/login}" class="small text-decoration-none fw-medium text-cine-primary">
                        <i class="fa-solid fa-arrow-left me-1"></i>Quay lại đăng nhập
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
