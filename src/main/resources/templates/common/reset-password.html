<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: master(
          title = ~{::title},
          sidebar = ~{},
          content = ~{::#page-content},
          actorCss = ~{},
          actorJs = ~{}
      )}">
<head>
    <title>Đặt lại mật khẩu | CineFlow</title>
</head>
<body>

<div id="page-content" class="container py-5">
    <div class="card shadow-sm border-0 mx-auto auth-card">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="fa-solid fa-lock fs-2 text-cine-primary mb-2"></i>
                <h4 class="fw-bold mb-1">ĐẶT LẠI MẬT KHẨU</h4>
                <p class="small text-muted">Vui lòng nhập mật khẩu mới cho tài khoản của bạn</p>
            </div>

            <!-- Thông báo lỗi khi mật khẩu không khớp hoặc token lỗi -->
            <div class="alert alert-danger py-2 mb-3 small" th:if="${errorMessage}" th:text="${errorMessage}"></div>

            <form th:action="@{/reset-password}" th:object="${resetPasswordRequest}" method="post">
                <!-- Token ẩn xác thực -->
                <input type="hidden" th:field="*{token}" />

                <div class="mb-3">
                    <label class="form-label fw-medium">Mật khẩu mới <span class="text-danger">*</span></label>
                    <input type="password" th:field="*{password}" class="form-control"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                           placeholder="Nhập từ 6 đến 32 ký tự..." required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-medium">Xác nhận mật khẩu mới <span class="text-danger">*</span></label>
                    <input type="password" th:field="*{confirmPassword}" class="form-control"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                           placeholder="Nhập lại mật khẩu mới..." required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                </div>

                <button type="submit" class="btn btn-cine w-100 mt-2 py-2">
                    <i class="fa-solid fa-check me-1"></i>Xác nhận đổi mật khẩu
                </button>

                <div class="text-center mt-3">
                    <a th:href="@{/login}" class="small text-decoration-none fw-medium text-cine-primary">
                        <i class="fa-solid fa-arrow-left me-1"></i>Quay lại đăng nhập
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
