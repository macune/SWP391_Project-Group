<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: master(~{::title}, ~{::#sidebar}, ~{::#page-content}, ~{::#actorCss}, ~{::#actorJs})}">
<head>
    <title>Đặt vé xem phim trực tuyến | CineFlow</title>
    <th:block id="actorCss">
        <link rel="stylesheet" th:href="@{/css/customer.css}">
    </th:block>
</head>
<body>

<!-- Truyền một block rỗng để layout.html không bị lỗi khi tìm sidebar -->
<th:block id="sidebar"></th:block>

<div id="page-content" class="container py-4">

    <!-- Thanh Tìm Kiếm Nâng Cao -->
    <div class="row justify-content-center mb-5">
        <div class="col-md-10">
            <form th:action="@{/}" method="get" class="card border-cine shadow-sm p-3 bg-white">
                <div class="row g-2">
                    <!-- Ô tìm kiếm tên -->
                    <div class="col-md-4">
                        <div class="input-group">
                            <span class="input-group-text bg-white border-cine border-end-0 text-cine-primary"><i class="fa-solid fa-magnifying-glass"></i></span>
                            <input type="text" name="search" th:value="${keyword}" class="form-control border-cine border-start-0 ps-0" placeholder="Tìm kiếm tên phim...">
                        </div>
                    </div>

                    <!-- Lọc Thể loại -->
                    <div class="col-md-2">
                        <select name="genre" class="form-select border-cine text-cine-main">
                            <option value="">Thể loại</option>
                            <option th:each="g : ${genres}" th:value="${g.displayName}" th:text="${g.displayName}" th:selected="${g.displayName == selectedGenre}"></option>
                        </select>
                    </div>

                    <!-- Lọc Ngôn ngữ -->
                    <div class="col-md-3">
                        <select name="language" class="form-select border-cine text-cine-main">
                            <option value="">Ngôn ngữ</option>
                            <option th:each="l : ${languages}" th:value="${l.displayName}" th:text="${l.displayName}" th:selected="${l.displayName == selectedLanguage}"></option>
                        </select>
                    </div>

                    <!-- Lọc Độ tuổi -->
                    <div class="col-md-2">
                        <select name="ageRating" class="form-select border-cine text-cine-main">
                            <option value="">Độ tuổi</option>
                            <option th:each="a : ${ageRatings}" th:value="${a.name()}" th:text="${a.displayName}" th:selected="${a.name() == selectedAgeRating}"></option>
                        </select>
                    </div>

                    <!-- Nút Tìm kiếm -->
                    <div class="col-md-1">
                        <button type="submit" class="btn btn-cine w-100 fw-bold">Tìm</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Tiêu đề -->
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom border-cine">
        <h4 class="fw-bold text-uppercase mb-0 text-cine-main">
            <i class="fa-solid fa-heart text-cine-primary me-2"></i><span th:text="${pageTitle}">Phim Đang Chiếu</span>
        </h4>
        <span class="badge bg-cine-soft px-3 py-2 text-cine-hot border border-cine">Toàn hệ thống</span>
    </div>

    <!-- Danh sách Phim Đang Chiếu -->
    <div class="row row-cols-1 row-cols-md-4 g-4 mb-5">
        <div class="col-12 text-center text-cine-pastel py-5" th:if="${#lists.isEmpty(movies)}">
            <h5>Không tìm thấy phim nào phù hợp!</h5>
        </div>

        <div class="col" th:each="m : ${movies}">
            <div class="card h-100 border-cine shadow-sm">
                <a th:href="@{/movie-detail/{id}(id=${m.movieId})}" class="text-decoration-none">
                    <img th:src="${m.posterUrl != null and !m.posterUrl.isEmpty() ? m.posterUrl : '/images/posters/default-poster.jpg'}" class="card-img-top movie-poster-card" th:alt="${m.title}" style="height: 350px; object-fit: cover;">
                </a>
                <div class="card-body d-flex flex-column bg-cine-main">
                    <h6 class="card-title fw-bold text-cine-main" th:text="${m.title}">Tên Phim</h6>
                    <p class="small text-cine-muted mb-3">
                        <span th:text="${m.duration} + ' phút | '"></span>
                        <span class="badge bg-cine-hot" th:text="${m.ageRating}">P</span>
                    </p>
                    <a th:href="@{/movie-detail/{id}(id=${m.movieId})}" class="btn btn-cine btn-sm mt-auto w-100">
                        <i class="fa-solid fa-ticket me-1"></i>Xem chi tiết
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Phim Sắp Chiếu -->
    <th:block th:if="${pageTitle == 'Phim Đang Chiếu Tại CineFlow' and not #lists.isEmpty(comingSoonMovies)}">
        <div class="d-flex justify-content-between align-items-center mt-5 mb-4 pb-2 border-bottom border-cine opacity-75">
            <h4 class="fw-bold text-uppercase mb-0 text-cine-muted">
                <i class="fa-solid fa-calendar-days text-cine-primary me-2"></i>Phim Sắp Chiếu
            </h4>
        </div>
        <div class="row row-cols-1 row-cols-md-4 g-4 mb-5">
            <div class="col" th:each="m : ${comingSoonMovies}">
                <div class="card h-100 border-cine shadow-sm opacity-75">
                    <img th:src="${m.posterUrl != null and !m.posterUrl.isEmpty() ? m.posterUrl : '/images/posters/default-poster.jpg'}" class="card-img-top movie-poster-card" th:alt="${m.title}" style="height: 350px; object-fit: cover;">
                    <div class="card-body d-flex flex-column bg-cine-frame">
                        <h6 class="card-title fw-bold text-cine-main" th:text="${m.title}">Tên Phim</h6>
                        <p class="small text-cine-hot fw-bold mt-auto mb-0">Dự kiến: <span th:text="${#temporals.format(m.releaseDate, 'dd/MM/yyyy')}"></span></p>
                    </div>
                </div>
            </div>
        </div>
    </th:block>

</div>

<th:block id="actorJs">
    <script th:src="@{/js/customer.js}"></script>
</th:block>

</body>
</html>
