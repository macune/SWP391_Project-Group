<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: master(
          title = ~{::title},
          sidebar = ~{layout/sidebar :: manager-sidebar},
          content = ~{::#page-content},
          actorCss = ~{::link},
          actorJs = ~{::script}
      )}">
<head>
    <title>Quản lý Phòng chiếu | CineFlow Manager</title>
    <link rel="stylesheet" th:href="@{/css/manager.css}">
</head>
<body>

<div id="page-content" class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0">🎬 Danh sách Phòng chiếu (Chi nhánh #<span th:text="${branchId}"></span>)</h4>
        <button type="button" class="btn btn-cine px-3 py-2" data-bs-toggle="modal" data-bs-target="#addHallModal">
            <i class="fa-solid fa-plus me-1"></i>Thêm Phòng chiếu mới
        </button>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fa-solid fa-circle-check me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fa-solid fa-triangle-exclamation me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th class="ps-3">ID</th>
                    <th>Tên phòng chiếu</th>
                    <th>Sức chứa (Số ghế)</th>
                    <th>Trạng thái</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(halls)}">
                    <td colspan="4" class="text-center py-4 text-muted">Chưa có phòng chiếu nào trong chi nhánh này.</td>
                </tr>
                <tr th:each="h : ${halls}">
                    <td class="ps-3 fw-bold" th:text="${h.hallId}">1</td>
                    <td class="fw-semibold text-primary" th:text="${h.hallName}">Phòng 01 (IMAX)</td>
                    <td th:text="${h.capacity + ' ghế'}">120 ghế</td>
                    <td>
                        <span class="badge"
                              th:classappend="${h.status.name() == 'ACTIVE' ? 'bg-success' : 'bg-warning text-dark'}"
                              th:text="${h.status}">ACTIVE</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="addHallModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold"><i class="fa-solid fa-couch me-2"></i>Thêm Phòng chiếu mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/manager/halls/add}" th:object="${newHall}" method="post">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-medium">Tên phòng chiếu <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{hallName}" class="form-control" placeholder="Ví dụ: Phòng 01 (IMAX)" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium">Sức chứa (Số lượng ghế) <span class="text-danger">*</span></label>
                            <input type="number" th:field="*{capacity}" class="form-control" placeholder="Ví dụ: 120" min="1" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium">Trạng thái</label>
                            <select th:field="*{status}" class="form-select">
                                <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-cine px-4">Lưu Phòng chiếu</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>

<script th:src="@{/js/manager.js}"></script>
</body>
</html>
