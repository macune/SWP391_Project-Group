<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: master(
          ~{::title},
          ~{layout/sidebar :: manager-sidebar},
          ~{::content},
          ~{},
          ~{::actorJs}
      )}">

<head>

    <title th:fragment="title">
        F&B Management
    </title>

</head>

<body>

<th:block th:fragment="content">

    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold mb-1">
                Quản lý Bắp nước
            </h2>

            <p class="text-cine-pastel mb-0">
                Quản lý các sản phẩm đồ ăn và thức uống
            </p>

        </div>

        <!-- CREATE -->
        <<button type="button"
                 class="btn btn-cine"
                 data-bs-toggle="modal"
                 data-bs-target="#fnbModal">

        <i class="fa-solid fa-plus me-1"></i>
        Thêm sản phẩm

    </button>

    </div>

    <form th:action="@{/manager/fnb-items}"
          method="get"
          class="row g-3 mb-4">

        <!-- SEARCH -->
        <div class="col-md-6">
            <label class="form-label fw-semibold">
                Tìm kiếm theo tên
            </label>

            <input type="text"
                   name="name"
                   th:value="${param.name}"
                   class="form-control"
                   placeholder="Nhập tên sản phẩm...">
        </div>

        <!-- CATEGORY -->
        <div class="col-md-3">
            <label class="form-label fw-semibold">
                Danh mục
            </label>

            <select name="category"
                    class="form-select">

                <option value="">
                    Tất cả danh mục
                </option>

                <option value="DRINK"
                        th:selected="${param.category != null
                    and param.category[0] == 'DRINK'}">
                    Drink
                </option>

                <option value="COMBO"
                        th:selected="${param.category != null
                    and param.category[0] == 'COMBO'}">
                    Combo
                </option>

                <option value="FOOD"
                        th:selected="${param.category != null
                    and param.category[0] == 'FOOD'}">
                    Food
                </option>

            </select>
        </div>

        <!-- BUTTON -->
        <div class="col-md-3 d-flex align-items-end gap-2">

            <button type="submit"
                    class="btn btn-cine">
                <i class="fa-solid fa-magnifying-glass me-1"></i>
                Tìm kiếm
            </button>

            <a th:href="@{/manager/fnb-items}"
               class="btn btn-outline-cine">
                Reset
            </a>

        </div>

    </form>
    <!-- ========================= -->
    <!-- TABLE -->
    <!-- ========================= -->

    <div class="card shadow-sm">

        <div class="card-body">

            <table class="table table-cine align-middle">

                <thead>

                <tr>

                    <th>STT</th>
                    <th>Ảnh</th>
                    <th>Tên</th>
                    <th>Danh mục</th>
                    <th>Giá</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>

                </tr>

                </thead>


                <tbody>

                <!-- LOOP F&B -->

                <tr th:each="item, itemStat : ${items}">

                    <!-- stt -->
                    <td th:text="${itemStat.index + 1}"></td>


                    <!-- IMAGE -->

                    <td>

                        <img th:if="${item.imageUrl != null
                                     and !#strings.isEmpty(item.imageUrl)}"

                             th:src="@{${item.imageUrl}}"

                             alt="F&B Image"

                             width="100"
                             height="100"

                             style="object-fit: cover;
                                    border-radius: 8px;">

                    </td>


                    <!-- NAME -->

                    <td th:text="${item.name}">
                        Coca
                    </td>


                    <!-- CATEGORY -->

                    <td th:text="${item.category}">
                        DRINK
                    </td>


                    <!-- PRICE -->

                    <td>

                        <span th:text="${item.price}">
                            20000
                        </span>

                        VND

                    </td>


                    <!-- STATUS -->

                    <td>

                        <span th:if="${item.isAvailable}"
                              class="badge bg-success">

                            Available

                        </span>


                        <span th:unless="${item.isAvailable}"
                              class="badge bg-secondary">

                            Unavailable

                        </span>

                    </td>


                    <!-- ACTION -->

                    <td>

                        <!-- EDIT -->

                        <a th:href="@{/manager/fnb-items/edit/{id}(id=${item.id})}"
                           class="btn btn-sm btn-outline-cine">

                            Edit

                        </a>


                        <!-- DELETE -->

                        <form th:action="@{/manager/fnb-items/delete/{id}(id=${item.id})}"
                              method="post"
                              style="display:inline;">

                            <button type="submit"
                                    class="btn btn-sm btn-outline-danger"
                                    onclick="return confirm('Bạn có chắc muốn xóa sản phẩm này?');">

                                Delete

                            </button>

                        </form>

                    </td>

                </tr>


                <!-- EMPTY -->

                <tr th:if="${#lists.isEmpty(items)}">

                    <td colspan="7"
                        class="text-center py-4">

                        Chưa có sản phẩm F&B.

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>


    <!-- ========================= -->
    <!-- CREATE / EDIT MODAL -->
    <!-- ========================= -->

    <div class="modal fade"
         id="fnbModal"
         tabindex="-1"
         th:classappend="${item != null and item.id != null} ? ' show' : ''"
         th:style="${item != null and item.id != null} ? 'display:block;' : ''">

        <div class="modal-dialog">

            <div class="modal-content">


                <!-- HEADER -->

                <div class="modal-header">

                    <h5 class="modal-title"
                        th:text="${item != null and item.id != null}
                            ? 'Chỉnh sửa sản phẩm'
                            : 'Thêm sản phẩm'">

                        Thêm sản phẩm

                    </h5>


                    <a th:href="@{/manager/fnb-items}"
                       class="btn-close">

                    </a>

                </div>


                <!-- BODY -->

                <div class="modal-body">

                    <!-- ========================= -->
                    <!-- CREATE + EDIT FORM -->
                    <!-- ========================= -->

                    <form th:action="@{/manager/fnb-items/save}"
                          th:object="${item}"
                          method="post">


                        <!-- ID -->

                        <input type="hidden"
                               th:field="*{id}">


                        <!-- NAME -->

                        <div class="mb-3">

                            <label class="form-label">
                                Tên sản phẩm
                            </label>

                            <input type="text"
                                   th:field="*{name}"
                                   class="form-control"
                                   required>

                        </div>


                        <!-- CATEGORY -->

                        <div class="mb-3">

                            <label class="form-label">
                                Danh mục
                            </label>

                            <select th:field="*{category}"
                                    class="form-select"
                                    required>

                                <option value="">
                                    -- Chọn danh mục --
                                </option>

                                <option value="DRINK">
                                    Drink
                                </option>

                                <option value="COMBO">
                                    Combo
                                </option>

                                <option value="FOOD">
                                    Food
                                </option>

                            </select>

                        </div>


                        <!-- PRICE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Giá
                            </label>

                            <input type="number"
                                   th:field="*{price}"
                                   class="form-control"
                                   min="0"
                                   step="0.01"
                                   required>

                        </div>


                        <!-- AVAILABLE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Trạng thái
                            </label>

                            <select th:field="*{isAvailable}"
                                    class="form-select">

                                <option value="true">
                                    Available
                                </option>

                                <option value="false">
                                    Unavailable
                                </option>

                            </select>

                        </div>


                        <!-- IMAGE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Image URL
                            </label>

                            <input type="text"
                                   th:field="*{imageUrl}"
                                   class="form-control"
                                   placeholder="/images/FnB/Coca.jpg">

                        </div>


                        <!-- FOOTER -->

                        <div class="text-end">

                            <a th:href="@{/manager/fnb-items}"
                               class="btn btn-outline-cine">

                                Hủy

                            </a>


                            <button type="submit"
                                    class="btn btn-cine">

                                <span th:text="${item != null and item.id != null}
                                    ? 'Cập nhật'
                                    : 'Thêm sản phẩm'">

                                    Lưu

                                </span>

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- ACTOR JS -->
    <!-- ========================= -->

    <th:block th:fragment="actorJs">
    </th:block>

</th:block>

</body>

</html>
