<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: master(~{::title}, ~{layout/sidebar :: manager-sidebar}, ~{::#content}, ~{::#actorCss}, ~{::#actorJs})}">
<head>
    <title>Cài Đặt Chi Nhánh | CineFlow Manager</title>
    <th:block id="actorCss"><link rel="stylesheet" th:href="@{/css/manager.css}"></th:block>
</head>
<body>

<div id="content" class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0 text-cine-primary">🏢 Cập Nhật Chi Nhánh Của Bạn</h4>
            </div>

            <!-- Khối thông báo -->
            <div th:if="${successMessage}" class="alert bg-cine-soft border-cine alert-dismissible fade show shadow-sm" role="alert">
                <i class="fa-solid fa-circle-check me-2"></i><span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert bg-cine-hot text-white alert-dismissible fade show shadow-sm" role="alert">
                <i class="fa-solid fa-triangle-exclamation me-2"></i><span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Form Cập Nhật -->
            <div class="card shadow-sm border-cine bg-white">
                <div class="card-header py-3 bg-cine-frame border-bottom border-cine">
                    <h5 class="mb-0 fw-bold text-cine-main"><i class="fa-solid fa-building-circle-check me-2"></i>Cài đặt thông tin liên hệ & giờ giấc</h5>
                </div>

                <div class="card-body p-4 text-cine-main">
                    <form th:action="@{/manager/branch-settings/edit}" th:object="${branchRequest}" method="POST">
                        <input type="hidden" th:field="*{branchId}">
                        <input type="hidden" th:field="*{status}"> <!-- Manager không được quyền tự Close/Bảo trì chi nhánh -->

                        <div class="mb-4">
                            <label class="form-label fw-medium text-cine-main">Tên chi nhánh <span class="text-cine-hot">*</span></label>
                            <input type="text" th:field="*{branchName}" class="form-control border-cine shadow-sm" required />
                        </div>

                        <!-- Chọn Tỉnh/Thành và Quận/Huyện -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Tỉnh/Thành phố <span class="text-cine-hot">*</span></label>
                                <select id="citySelect" class="form-select border-cine shadow-sm" required onchange="loadWards()">
                                    <option value="">-- Chọn Tỉnh/Thành phố --</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Quận/Huyện <span class="text-cine-hot">*</span></label>
                                <select id="wardSelect" class="form-select border-cine shadow-sm" required onchange="updateAddress()">
                                    <option value="">-- Chọn Quận/Huyện --</option>
                                </select>
                            </div>
                        </div>
                        <!-- Địa chỉ chi tiết (Số nhà, tên đường...) -->
                        <div class="mb-3">
                            <label class="form-label fw-medium text-cine-main">Địa chỉ chi tiết (Số nhà, tên đường, tòa nhà...) <span class="text-cine-hot">*</span></label>
                            <input type="text" id="detailAddressInput" class="form-control border-cine shadow-sm"
                                   placeholder="Ví dụ: Số 241 Xuân Thủy hoặc Tầng 3 TTTM..."
                                   required oninput="updateAddress()" />
                            <small class="text-muted">Địa chỉ lưu vào hệ thống: <strong id="previewAddress" class="text-cine-primary">Chưa nhập</strong></small>
                        </div>
                        <!-- Trường ẩn lưu địa chỉ hoàn chỉnh gửi lên Server -->
                        <input type="hidden" id="finalAddress" th:field="*{address}" required>
                        <!-- Hotline (đổi placeholder gợi ý đúng chuẩn 10 số) -->
                        <div class="mb-4">
                            <label class="form-label fw-medium text-cine-main">Đường dây nóng (Hotline) <span class="text-cine-hot">*</span></label>
                            <input type="text" th:field="*{hotline}" class="form-control border-cine shadow-sm" placeholder="Ví dụ: 0901234567" required />
                        </div>

                        <div class="row g-3 mb-4 pb-4 border-bottom border-cine">
                            <div class="col-md-6">
                                <label class="form-label fw-medium text-cine-main">Giờ mở cửa <span class="text-cine-hot">*</span></label>
                                <input type="time" th:field="*{openingTime}" class="form-control border-cine shadow-sm" required />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium text-cine-main">Giờ đóng cửa <span class="text-cine-hot">*</span></label>
                                <input type="time" th:field="*{closingTime}" class="form-control border-cine shadow-sm" required />
                            </div>
                        </div>

                        <div class="text-end">
                            <a th:href="@{/manager/showtimes}" class="btn btn-outline-secondary me-2 px-4">Hủy bỏ</a>
                            <button type="submit" class="btn btn-cine px-5 fw-bold shadow-sm">
                                <i class="fa-solid fa-floppy-disk me-2"></i>Lưu Thay Đổi
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<th:block id="actorJs">
    <script>
        let locationData = [];
        fetch('/js/locations.json')
            .then(response => response.json())
            .then(data => {
                locationData = data;
                const citySelect = document.getElementById('citySelect');
                // Nạp danh sách Tỉnh/Thành
                data.forEach((city, index) => {
                    let option = document.createElement('option');
                    option.value = index;
                    option.text = city.name;
                    citySelect.appendChild(option);
                });
                // Khôi phục và fill lại địa chỉ cũ của chi nhánh
                const savedAddress = document.getElementById('finalAddress').value;
                if (savedAddress) {
                    restoreOldAddress(savedAddress);
                }
            })
            .catch(err => console.error("Không thể tải locations.json:", err));
        // Hàm phân tích và điền lại thông tin cũ vào đúng các ô
        function restoreOldAddress(address) {
            const citySelect = document.getElementById('citySelect');
            const wardSelect = document.getElementById('wardSelect');
            const detailInput = document.getElementById('detailAddressInput');
            detailInput.value = address;
            if (address.includes(',')) {
                const parts = address.split(',').map(s => s.trim());
                if (parts.length >= 2) {
                    const rawCity = parts[parts.length - 1];
                    const rawWard = parts[parts.length - 2];
                    const detailPart = parts.slice(0, parts.length - 2).join(', ');
                    // Làm sạch tiền tố TP., Tỉnh để so sánh chuẩn xác
                    const cleanCity = rawCity.replace(/^(TP\.|Thành phố|Tỉnh)\s*/i, '').trim().toLowerCase();
                    const cityIndex = locationData.findIndex(item => {
                        const itemCity = item.name.replace(/^(TP\.|Thành phố|Tỉnh)\s*/i, '').trim().toLowerCase();
                        return itemCity === cleanCity || item.name.toLowerCase().includes(cleanCity);
                    });
                    if (cityIndex !== -1) {
                        citySelect.value = cityIndex;
                        // Nạp danh sách quận/huyện
                        populateWards(cityIndex);
                        wardSelect.value = rawWard;
                        detailInput.value = detailPart || rawWard;
                    }
                }
            }
            document.getElementById('finalAddress').value = address;
            document.getElementById('previewAddress').innerText = address || "Chưa nhập";
        }
        // Nạp quận huyện theo tỉnh được chọn
        function populateWards(cityIndex) {
            const wardSelect = document.getElementById('wardSelect');
            wardSelect.innerHTML = '<option value="">-- Chọn Quận/Huyện --</option>';
            if (cityIndex !== "" && locationData[cityIndex]) {
                locationData[cityIndex].wards.forEach(ward => {
                    let option = document.createElement('option');
                    option.value = ward;
                    option.text = ward;
                    wardSelect.appendChild(option);
                });
            }
        }
        // Sự kiện khi người dùng đổi Tỉnh/Thành trên giao diện
        function loadWards() {
            const cityIndex = document.getElementById('citySelect').value;
            populateWards(cityIndex);
            updateAddress();
        }
        // Đồng bộ dữ liệu ghép thành địa chỉ hoàn chỉnh
        function updateAddress() {
            const citySelect = document.getElementById('citySelect');
            const wardSelect = document.getElementById('wardSelect');
            const detail = document.getElementById('detailAddressInput').value.trim();
            const cityName = citySelect.value !== "" ? citySelect.options[citySelect.selectedIndex].text : "";
            const wardName = wardSelect.value;
            const parts = [detail, wardName, cityName].filter(Boolean);
            const fullAddr = parts.join(", ");
            document.getElementById('finalAddress').value = fullAddr;
            document.getElementById('previewAddress').innerText = fullAddr || "Chưa nhập";
        }
    </script>
</th:block>
</body>
</html>
