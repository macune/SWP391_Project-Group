<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: master(
          title = ~{::title},
          sidebar = ~{layout/sidebar :: manager-sidebar},
          content = ~{::#page-content},
          actorCss = ~{::#actorCss},
          actorJs = ~{::#actorJs}
      )}">
<head>
    <title>Tạo suất chiếu | CineFlow Manager</title>

    <th:block id="actorCss">
        <link rel="stylesheet" th:href="@{/css/manager.css}">
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    </th:block>
</head>
<body>

<div id="page-content" class="container-fluid">
<th:block th:fragment="content">
    <div class="showtime-form">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Tạo suất chiếu</h2>
            <p class="text-cine-pastel mb-0">
                Chọn phim, phòng chiếu và thời gian bắt đầu
            </p>
        </div>

        <a th:href="@{/manager/showtimes}"
           class="btn btn-outline-cine">
            Quay lại lịch chiếu
        </a>
    </div>

    <!-- Success message -->
    <div th:if="${successMessage}"
         class="alert alert-success"
         role="alert"
         th:text="${successMessage}">
    </div>

    <!-- Error message -->
    <div th:if="${errorMessage}"
         class="alert alert-danger"
         role="alert"
         th:text="${errorMessage}">
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">

            <form th:action="@{/manager/showtimes/create}"
                  th:object="${showtime}"
                  method="post">

                <!-- Movie -->
                <div class="mb-3">
                    <label for="movieId" class="form-label">
                        Phim <span class="text-danger">*</span>
                    </label>

                    <select id="movieId"
                            th:field="*{movieId}"
                            class="form-select"
                            required>

                        <option value="">-- Chọn phim --</option>

                        <option th:each="movie : ${movies}"
                                th:value="${movie.movieId}"
                                th:text="${movie.title
                                    + ' (' + movie.duration + ' phút)'}">
                        </option>
                    </select>

                    <div class="text-danger small"
                         th:if="${#fields.hasErrors('movieId')}"
                         th:errors="*{movieId}">
                    </div>
                </div>

                <!-- Hall -->
                <div class="mb-3">
                    <label for="hallId" class="form-label">
                        Phòng chiếu <span class="text-danger">*</span>
                    </label>

                    <select id="hallId"
                            th:field="*{hallId}"
                            class="form-select"
                            required>

                        <option value="">-- Chọn phòng chiếu --</option>

                        <option th:each="hall : ${halls}"
                                th:value="${hall.hallId}"
                                th:text="${hall.hallName
                                    + ' - ' + hall.branch.branchName}">
                        </option>
                    </select>

                    <div class="text-danger small"
                         th:if="${#fields.hasErrors('hallId')}"
                         th:errors="*{hallId}">
                    </div>
                </div>

                <!-- Showtime date -->
                <div class="mb-3">
                    <label for="showDate" class="form-label">
                        Ngày chiếu <span class="text-danger">*</span>
                    </label>

                    <input type="text"
                           id="showDate"
                           name="showDate"
                           class="form-control"
                           placeholder="dd/mm/yyyy"
                           autocomplete="off"
                           th:value="${showtime.showDate != null
           ? #temporals.format(showtime.showDate, 'dd/MM/yyyy') : ''}"
                           required>


                    <div class="text-danger small"
                         th:if="${#fields.hasErrors('showDate')}"
                         th:errors="*{showDate}">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Các ngày chiếu bổ sung</label>

                    <div id="duplicate-dates">
                        <input type="text"
                               name="duplicateDates"
                               class="form-control mb-2 duplicate-date"
                               placeholder="dd/mm/yyyy"
                               autocomplete="off">
                    </div>

                    <button type="button"
                            class="btn btn-outline-secondary"
                            onclick="addDateInput()">
                        + Thêm ngày chiếu
                    </button>

                    <small class="text-muted d-block mt-2">
                        Các ngày bổ sung sẽ sử dụng cùng phim, phòng chiếu,
                        giờ bắt đầu và giá vé với ngày chính.
                    </small>
                </div>

                <!-- Start time -->
                <div class="mb-3">
                    <label for="startTime" class="form-label">
                        Giờ bắt đầu <span class="text-danger">*</span>
                    </label>

                    <input type="time"
                           id="startTime"
                           th:field="*{startTime}"
                           class="form-control"
                           required>

                    <div class="text-danger small"
                         th:if="${#fields.hasErrors('startTime')}"
                         th:errors="*{startTime}">
                    </div>
                </div>

                <!-- Base price -->
                <div class="mb-4">
                    <label for="basePrice" class="form-label">
                        Giá vé cơ bản (VND)
                        <span class="text-danger">*</span>
                    </label>

                    <input type="number"
                           id="basePrice"
                           th:field="*{basePrice}"
                           class="form-control"
                           min="0.01"
                           step="0.01"
                           placeholder="Ví dụ: 80000"
                           required>

                    <div class="text-danger small"
                         th:if="${#fields.hasErrors('basePrice')}"
                         th:errors="*{basePrice}">
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/manager/showtimes}"
                       class="btn btn-outline-secondary">
                        Hủy
                    </a>

                    <button type="submit" class="btn btn-cine">
                        <i class="fa-solid fa-calendar-plus me-1"></i>
                        Tạo suất chiếu
                    </button>
                </div>

            </form>

        </div>
    </div>
    </div>


    <th:block id="actorJs">
        <script th:src="@{/js/manager.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
        <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/vn.js"></script>
        <script>
            (function () {

function initDatePicker(input) {
    if (!input) return;

    if (input._flatpickr) {
        input._flatpickr.destroy();
    }

    flatpickr(input, {
        dateFormat: "d/m/Y",
        allowInput: true,
        clickOpens: true,
        locale: {
            ...flatpickr.l10ns.vn,
            firstDayOfWeek: 1,
            months: {
                shorthand: [
                    "Th1", "Th2", "Th3", "Th4",
                    "Th5", "Th6", "Th7", "Th8",
                    "Th9", "Th10", "Th11", "Th12"
                ],
                longhand: [
                    "Tháng 1", "Tháng 2", "Tháng 3", "Tháng 4",
                    "Tháng 5", "Tháng 6", "Tháng 7", "Tháng 8",
                    "Tháng 9", "Tháng 10", "Tháng 11", "Tháng 12"
                ]
            }
        },
        monthSelectorType: "dropdown"
    });
}


                function initPage() {
                    initDatePicker(document.getElementById("showDate"));

                    document.querySelectorAll(".duplicate-date")
                        .forEach(initDatePicker);
                }

                window.addDateInput = function () {
                    const container =
                        document.getElementById("duplicate-dates");

                    if (!container) return;

                    const input = document.createElement("input");
                    input.type = "text";
                    input.name = "duplicateDates";
                    input.className =
                        "form-control mb-2 duplicate-date";
                    input.placeholder = "dd/mm/yyyy";
                    input.autocomplete = "off";

                    container.appendChild(input);
                    initDatePicker(input);
                };

                if (typeof window.flatpickr === "function") {
                    initPage();
                } else {
                    const script = document.createElement("script");
                    script.src =
                        "https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.js";

                    script.onload = initPage;
                    script.onerror = function () {
                        console.error("Không tải được thư viện Flatpickr");
                    };

                    document.head.appendChild(script);
                }
            })();
        </script>
    </th:block>
</th:block>
</div>
</body>
</html>
