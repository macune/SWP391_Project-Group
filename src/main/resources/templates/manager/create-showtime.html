<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: master(
          title = ~{::title},
          sidebar = ~{layout/sidebar :: manager-sidebar},
          content = ~{::content},
          actorCss = ~{::actorCss},
          actorJs = ~{::actorJs}
      )}">
<head>
    <title>Tạo suất chiếu | CineFlow Manager</title>

    <th:block th:fragment="actorCss">
        <link rel="stylesheet" th:href="@{/css/manager.css}">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    </th:block>
</head>
<body>

<div id="page-content" class="container-fluid">
    <th:block th:fragment="content">
        <div class="showtime-form">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold mb-1">Tạo suất chiếu</h2>
                    <p class="text-cine-pastel mb-0">Chọn phim, phòng chiếu và thời gian bắt đầu</p>
                </div>
                <a th:href="@{/manager/showtimes}" class="btn btn-outline-cine">Quay lại lịch chiếu</a>
            </div>

            <!-- Success message -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fa-solid fa-circle-check me-2"></i><span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Error message -->
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fa-solid fa-triangle-exclamation me-2"></i><span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card shadow-sm border-cine">
                <div class="card-body p-4">
                    <form th:action="@{/manager/showtimes/create}" th:object="${showtime}" method="post">
                        <!-- Movie -->
                        <div class="mb-3">
                            <label for="movieId" class="form-label">Phim <span class="text-danger">*</span></label>
                            <select id="movieId" th:field="*{movieId}" class="form-select" required>
                                <option value="">-- Chọn phim --</option>
                                <option th:each="movie : ${movies}" th:value="${movie.movieId}" th:text="${movie.title + ' (' + movie.duration + ' phút)'}"></option>
                            </select>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('movieId')}" th:errors="*{movieId}"></div>
                        </div>

                        <!-- Hall -->
                        <div class="mb-3">
                            <label for="hallId" class="form-label">Phòng chiếu <span class="text-danger">*</span></label>
                            <select id="hallId" th:field="*{hallId}" class="form-select" required>
                                <option value="">-- Chọn phòng chiếu --</option>
                                <option th:each="hall : ${halls}" th:value="${hall.hallId}" th:text="${hall.hallName + ' - ' + hall.branch.branchName}"></option>
                            </select>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('hallId')}" th:errors="*{hallId}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Các khoảng ngày chiếu <span class="text-danger">*</span>
                            </label>

                            <div id="date-ranges" class="d-flex flex-column gap-3"></div>

                            <button type="button" id="add-date-range"
                                    class="btn btn-outline-cine btn-sm mt-2">
                                <i class="fa-solid fa-plus me-1"></i> Thêm khoảng ngày
                            </button>

                            <input type="hidden" id="showDate" name="showDate"
                                   th:value="${showtime.showDate != null ? #temporals.format(showtime.showDate, 'dd/MM/yyyy') : ''}">

                            <div id="duplicate-dates">
                                <input th:each="dupDate : *{duplicateDates}"
                                       type="hidden"
                                       name="duplicateDates"
                                       class="duplicate-date"
                                       th:value="${#temporals.format(dupDate, 'dd/MM/yyyy')}">
                            </div>

                            <small class="text-muted d-block mt-2">
                                Mỗi ngày trong các khoảng đã chọn sẽ tạo một suất chiếu.
                            </small>
                        </div>

                        <!-- Start time -->
                        <div class="mb-3">
                            <label for="startTime" class="form-label">Giờ bắt đầu <span class="text-danger">*</span></label>
                            <input type="time" id="startTime" th:field="*{startTime}" class="form-control" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('startTime')}" th:errors="*{startTime}"></div>
                        </div>

                        <!-- Base price -->
                        <div class="mb-4">
                            <label for="basePrice" class="form-label">Giá vé cơ bản (VND) <span class="text-danger">*</span></label>
                            <input type="number" id="basePrice" th:field="*{basePrice}" class="form-control" min="0.01" step="0.01" placeholder="Ví dụ: 80000" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('basePrice')}" th:errors="*{basePrice}"></div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/manager/showtimes}" class="btn btn-outline-secondary">Hủy</a>
                            <button type="submit" class="btn btn-cine"><i class="fa-solid fa-calendar-plus me-1"></i>Tạo suất chiếu</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <th:block th:fragment="actorJs">
            <script th:src="@{/js/manager.js}"></script>
            <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
            <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/vn.js"></script>

            <script>
                (function () {
                    function initDateRangePicker() {
                        const container = document.getElementById("date-ranges");
                        const addButton = document.getElementById("add-date-range");
                        const showDate = document.getElementById("showDate");
                        const duplicateDates = document.getElementById("duplicate-dates");

                        if (!container || !addButton || !showDate || !duplicateDates) return;

                        function formatDate(date) {
                            return String(date.getDate()).padStart(2, "0") + "/" +
                                String(date.getMonth() + 1).padStart(2, "0") + "/" +
                                date.getFullYear();
                        }

                        function syncHidden() {
                            const dates = new Map();

                            container.querySelectorAll(".date-range-input").forEach(input => {
                                const selected = input._flatpickr.selectedDates;
                                if (!selected.length) return;

                                const start = selected[0];
                                const end = selected.length > 1 ? selected[1] : selected[0];

                                const current = new Date(start.getFullYear(), start.getMonth(), start.getDate());
                                const last = new Date(end.getFullYear(), end.getMonth(), end.getDate());

                                while (current <= last) {
                                    dates.set(formatDate(current), new Date(current));
                                    current.setDate(current.getDate() + 1);
                                }
                            });

                            const allDates = [...dates.entries()]
                                .sort((a, b) => a[1] - b[1])
                                .map(item => item[0]);

                            showDate.value = allDates[0] || "";
                            duplicateDates.innerHTML = "";

                            allDates.slice(1).forEach(date => {
                                const input = document.createElement("input");
                                input.type = "hidden";
                                input.name = "duplicateDates";
                                input.value = date;
                                input.className = "duplicate-date";
                                duplicateDates.appendChild(input);
                            });
                        }

                        function updateTitles() {
                            container.querySelectorAll(".date-range-item").forEach((item, index) => {
                                item.querySelector(".range-title").textContent = "Khoảng ngày " + (index + 1);
                            });
                        }

                        function addRange(defaultDates = []) {
                            const item = document.createElement("div");
                            item.className = "date-range-item border rounded p-3";

                            item.innerHTML = `
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="range-title fw-semibold"></span>
                    <button type="button" class="btn btn-sm btn-outline-danger remove-range">
                        <i class="fa-solid fa-trash-can me-1"></i>Xóa
                    </button>
                </div>
                <input type="text" class="form-control date-range-input"
                       placeholder="dd/mm/yyyy - dd/mm/yyyy"
                       autocomplete="off" readonly>
            `;

                            container.appendChild(item);

                            item.querySelector(".remove-range").addEventListener("click", () => {
                                item.remove();
                                if (!container.querySelector(".date-range-item")) addRange();
                                updateTitles();
                                syncHidden();
                            });

                            flatpickr(item.querySelector(".date-range-input"), {
                                mode: "range",
                                dateFormat: "d/m/Y",
                                rangeSeparator: " - ",
                                allowInput: false,
                                minDate: "today",
                                defaultDate: defaultDates,
                                locale: {
                                    ...flatpickr.l10ns.vn,
                                    firstDayOfWeek: 1,
                                    months: {
                                        shorthand: ["Th1", "Th2", "Th3", "Th4", "Th5", "Th6",
                                            "Th7", "Th8", "Th9", "Th10", "Th11", "Th12"],
                                        longhand: ["Tháng 1", "Tháng 2", "Tháng 3", "Tháng 4",
                                            "Tháng 5", "Tháng 6", "Tháng 7", "Tháng 8",
                                            "Tháng 9", "Tháng 10", "Tháng 11", "Tháng 12"]
                                    }
                                },
                                monthSelectorType: "dropdown",
                                onChange: syncHidden
                            });

                            updateTitles();
                        }

                        addRange();

                        addButton.addEventListener("click", () => addRange());
                    }

                    if (typeof window.flatpickr === "function") {
                        initDateRangePicker();
                    }
                })();
            </script>

        </th:block>
    </th:block>
</div>
</body>
</html>
