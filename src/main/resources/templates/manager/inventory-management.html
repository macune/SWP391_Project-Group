<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: master(
          title = ~{::title},
          sidebar = ~{layout/sidebar :: manager-sidebar},
          content = ~{::#page-content},
          actorCss = ~{::#dummy-css},
          actorJs = ~{::#dummy-js}
      )}">
<head>
    <title>Quản lý Tồn Kho | Manager</title>
</head>
<body>

<div id="page-content" class="container-fluid">
    <h4 class="mb-4 fw-bold text-cine-primary">Quản Lý Tồn Kho Chi Nhánh</h4>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row">
        <!-- Form Nhập Kho -->
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-cine-hot text-white">
                    <h6 class="mb-0">Nhập Kho (Cộng Thêm)</h6>
                </div>
                <div class="card-body">
                    <form th:action="@{/manager/inventory/import}" th:object="${stockRequest}" method="post">

                        <input type="hidden" th:field="*{branchId}">

                        <div class="mb-3">
                            <label class="form-label">Chọn Sản Phẩm <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{itemId}" required>
                                <option value="" disabled selected>-- Chọn món Đồ ăn/Thức uống để nhập --</option>
                                <option th:each="item : ${fnbItems}"
                                        th:value="${item.itemId}"
                                        th:text="${item.name}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Số lượng nhập thêm <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" th:field="*{quantityToAdd}" required min="1" placeholder="VD: 50">
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Xác nhận Nhập Kho</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Danh sách Tồn Kho -->
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-0 table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>STT</th>
                            <th>Tên Sản Phẩm</th>
                            <th>Danh Mục</th>
                            <th>Số Lượng Tồn</th>
                            <th>Cập Nhật</th>
                            <th>Thao tác</th> <!-- CỘT THAO TÁC MỚI -->
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="s, stat : ${stocks}">
                            <td class="fw-bold text-muted" th:text="${stat.count}"></td>
                            <td class="fw-bold text-primary" th:text="${s.itemName}"></td>
                            <td th:text="${s.itemCategory}"></td>
                            <td>
                                <span class="badge bg-info text-dark" th:text="${s.quantity}"></span>
                            </td>
                            <td th:text="${#temporals.format(s.lastUpdated, 'dd/MM/yyyy HH:mm')}"></td>
                            <td>
                                <!-- Nút Sửa (Mở Modal) -->
                                <button type="button" class="btn btn-sm btn-outline-warning" data-bs-toggle="modal" th:data-bs-target="'#editModal' + ${s.id}">
                                    Sửa
                                </button>

                                <!-- Nút Xóa -->
                                <form th:action="@{/manager/inventory/delete/{id}(id=${s.id})}" method="post" class="d-inline" onsubmit="return confirm('Bạn có chắc muốn xóa bản ghi này? (Thường dùng khi món bị hủy bỏ hoàn toàn)');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Xóa</button>
                                </form>

                                <!-- MODAL SỬA SỐ LƯỢNG CHO TỪNG DÒNG -->
                                <div class="modal fade" th:id="'editModal' + ${s.id}" tabindex="-1" aria-hidden="true">
                                    <div class="modal-dialog">
                                        <div class="modal-content">
                                            <form th:action="@{/manager/inventory/update/{id}(id=${s.id})}" method="post">
                                                <div class="modal-header bg-warning">
                                                    <h6 class="modal-title text-dark">Cập nhật kiểm kê: <span th:text="${s.itemName}"></span></h6>
                                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                                </div>
                                                <div class="modal-body text-start">
                                                    <div class="mb-3">
                                                        <label class="form-label">Số lượng thực tế mới <span class="text-danger">*</span></label>
                                                        <!-- Biến "quantity" này sẽ được hứng ở Controller (@RequestParam Integer quantity) -->
                                                        <input type="number" name="quantity" class="form-control" th:value="${s.quantity}" required min="0">
                                                        <small class="text-muted">Tính năng này ghi đè số lượng tồn kho cũ (VD: dùng khi kiểm kê thấy hao hụt).</small>
                                                    </div>
                                                </div>
                                                <div class="modal-footer">
                                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                                                    <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                                                </div>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                                <!-- END MODAL -->
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(stocks)}">
                            <td colspan="6" class="text-center py-4 text-muted">Kho hiện tại chưa có sản phẩm nào.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block id="dummy-css"></th:block>
<th:block id="dummy-js"></th:block>

</body>
</html>
