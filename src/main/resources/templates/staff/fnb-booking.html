<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/layout :: master(
          title = ~{::title},
          sidebar = ~{layout/sidebar :: staff-sidebar},
          content = ~{::#page-content},
          actorCss = ~{::#dummy-css},
          actorJs = ~{::#dummy-js}
      )}">
<head>
    <title>Quầy Vé POS | CineFlow Staff</title>
</head>
<body>

<div id="page-content" class="container-fluid">
    <!-- Header POS -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold mb-1 text-cine-primary">
                <i class="fa-solid fa-cash-register me-2"></i>Quầy Bán Vé & Bắp Nước (POS)
            </h4>
            <p class="small text-muted mb-0">
                Nhân viên trực quầy: <strong sec:authentication="name">staff</strong> | Chi nhánh: CineFlow Hà Nội
            </p>
        </div>
        <span class="badge bg-success px-3 py-2">Ca trực đang mở</span>
    </div>

    <!-- Nội dung chính -->
    <div class="row g-4">
        <!-- Cột Trái: Menu Bắp Nước (Mở rộng chiếm không gian) -->
        <div class="col-md-8">
            <div class="card border-0 shadow-sm p-4">
                <h5 class="fw-bold text-cine-primary mb-4 border-bottom pb-2">
                    <i class="fa-solid fa-burger me-2"></i>Menu Bắp Nước
                </h5>
                <div class="row row-cols-1 row-cols-md-3 g-3">
                    <!-- Vòng lặp lấy dữ liệu từ DTO BranchStockResponse -->
                    <div class="col" th:each="stock : ${menuItems}">
                        <!-- ... Giữ nguyên khối div card chứa bắp nước của bạn ở đây ... -->
                        <div class="card h-100 border-cine shadow-sm rounded-3">
                            <div class="bg-light d-flex align-items-center justify-content-center border-bottom" style="height: 120px;">
                                <img th:if="${stock.imageUrl != null and !stock.imageUrl.isEmpty()}"
                                     th:src="${stock.imageUrl}"
                                     class="img-fluid" style="max-height: 100px; object-fit: contain;">
                                <i th:unless="${stock.imageUrl != null and !stock.imageUrl.isEmpty()}"
                                   class="fa-solid fa-utensils text-secondary fs-1 opacity-50"></i>
                            </div>

                            <div class="card-body p-3 text-center d-flex flex-column">
                                <h6 class="card-title fw-bold text-dark mb-1 fs-6" th:text="${stock.itemName}">Tên món</h6>
                                <span class="badge bg-secondary mb-2 align-self-center px-2 py-1" style="font-size: 0.7rem;" th:text="${stock.itemCategory}">FOOD</span>

                                <div class="mt-auto">
                                    <div class="small text-muted mb-1">
                                        Kho: <span class="fw-bold" th:classappend="${stock.quantity <= 10 ? 'text-danger' : 'text-success'}" th:text="${stock.quantity}">0</span>
                                    </div>
                                    <p class="text-danger fw-bold mb-2" th:text="${#numbers.formatDecimal(stock.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></p>

                                    <button th:if="${stock.quantity > 0 and stock.isAvailable}"
                                            class="btn btn-sm btn-cine w-100 fw-bold shadow-sm btn-add-fnb"
                                            th:data-id="${stock.itemId}"
                                            th:data-name="${stock.itemName}"
                                            th:data-price="${stock.price}"
                                            onclick="addToCart(this)">
                                        <i class="fa-solid fa-plus me-1"></i>Thêm
                                    </button>

                                    <button th:unless="${stock.quantity > 0 and stock.isAvailable}" class="btn btn-sm btn-secondary w-100 disabled shadow-sm">
                                        Hết hàng
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Cột Phải: Giỏ hàng -->
        <div class="col-md-4">
            <div class="card border-0 shadow-sm p-4 sticky-top" style="top: 20px;">
                <h6 class="fw-bold text-cine-primary mb-3">Hóa Đơn Tạm Tính</h6>

                <div id="cart-items" class="mb-3" style="max-height: 300px; overflow-y: auto;"></div>

                <p id="empty-cart-msg" class="small text-muted text-center my-4">Chưa có bắp nước nào được chọn.</p>

                <hr/>

                <div class="d-flex justify-content-between fw-bold mb-3 fs-5">
                    <span>Tổng cộng:</span>
                    <span id="cart-total" class="text-cine-primary">0 ₫</span>
                </div>
                <button id="btn-checkout" class="btn btn-cine w-100" disabled="disabled">Thanh toán & In vé</button>
            </div>
        </div>
    </div>
</div>

<th:block id="dummy-css"></th:block>
<th:block id="dummy-js">
    <script th:src="@{/js/staff.js}"></script>
</th:block>

</body>
</html>
