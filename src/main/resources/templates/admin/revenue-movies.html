
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: master(
          title = ~{::title},
          sidebar = ~{layout/sidebar :: admin-sidebar},
          content = ~{::#page-content},
          actorCss = ~{::#actorCss},
          actorJs = ~{::#actorJs}
      )}">
<head>
    <title>Báo cáo doanh thu theo phim</title>
    <th:block id="actorCss">
        <link rel="stylesheet" th:href="@{/css/admin.css}">
    </th:block>
</head>
<body>
<div id="page-content" class="container-fluid py-4 revenue-page">

    <h2 class="fw-bold mb-1">Báo cáo doanh thu theo phim</h2>
    <p class="text-secondary mb-4"
       th:text="${currentBranch != null
       ? currentBranch.branchName
       : 'Toàn bộ chi nhánh'}">
    </p>
    <div class="d-flex justify-content-end mb-3">
        <a th:href="@{/admin/revenue/fnb(
        startDate=${startDate},
        endDate=${endDate}
    )}"
           class="btn-fnb-report">
            <i class="fa-solid fa-utensils me-2"></i>
            Báo cáo F&amp;B
        </a>
    </div>
    <form method="get" th:action="@{/admin/revenue}"
          class="card border-0 shadow-sm p-3 mb-4 revenue-filter-form">
        <input type="hidden" name="sortBy" th:value="${sortBy}">
        <input type="hidden" name="sortDir" th:value="${sortDir}">
        <div class="row g-3 align-items-end">
            <div class="col-md-3">
                <label for="branchId" class="form-label">Chi nhánh</label>
                <select id="branchId" name="branchId" class="form-select">
                    <option value="">Toàn bộ chi nhánh</option>
                    <option th:each="branch : ${branches}"
                            th:value="${branch.branchId}"
                            th:text="${branch.branchName}"
                            th:selected="${selectedBranchId != null
                    and selectedBranchId.equals(branch.branchId)}">
                    </option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="movieName" class="form-label">Tên phim</label>
                <input type="text"
                       id="movieName"
                       name="movieName"
                       class="form-control"
                       placeholder="Nhập tên phim..."
                       th:value="${movieName}">
            </div>
            <div class="col-md-3">
                <label for="startDate" class="form-label">Từ ngày</label>
                <input id="startDate" type="date" name="startDate"
                       class="form-control" th:value="${startDate}">
            </div>
            <div class="col-md-3">
                <label for="endDate" class="form-label">Đến ngày</label>
                <input id="endDate" type="date" name="endDate"
                       class="form-control" th:value="${endDate}">
            </div>
            <div class="col-md-3">
                <label for="movieStatus" class="form-label">Trạng thái phim</label>
                <select id="movieStatus" name="movieStatus" class="form-select">
                    <option value="">Tất cả trạng thái</option>
                    <option th:each="status : ${movieStatuses}"
                            th:value="${status}"
                            th:text="${status == T(fu.cinema.enums.MovieStatus).NOW_SHOWING ? 'Đang chiếu' :
                                      (status == T(fu.cinema.enums.MovieStatus).COMING_SOON ? 'Sắp chiếu' :
                                      (status == T(fu.cinema.enums.MovieStatus).ENDED ? 'Đã kết thúc' : 'Đã dừng'))}"
                            th:selected="${movieStatus == status}">
                    </option>
                </select>
            </div>
            <div class="col-md-3 d-flex gap-2">
                <button class="btn-filter flex-grow-1" type="submit">
                    <i class="fa-solid fa-filter me-1"></i>Lọc
                </button>
                <a th:href="@{/admin/revenue}" class="btn-reset">Đặt lại</a>
            </div>
        </div>
    </form>
    <!-- Showtime Revenue Summary -->
    <div class="row g-3 mb-4 revenue-summary">

        <!-- Tổng doanh thu -->
        <div class="col-lg-4 col-md-6">
            <div class="summary-card">
                <div class="summary-content">
                    <div class="summary-label">Tổng doanh thu vé</div>
                    <div class="summary-value"
                         th:text="${#numbers.formatDecimal(
                        totalRevenue, 0, 'COMMA', 0, 'POINT'
                     ) + ' ₫'}">
                    </div>
                </div>
                <div class="summary-icon">
                    <i class="fa-solid fa-money-bill-wave"></i>
                </div>
            </div>
        </div>

        <!-- Tổng suất chiếu -->
        <div class="col-lg-4 col-md-6">
            <div class="summary-card">
                <div class="summary-content">
                    <div class="summary-label">Tổng suất chiếu</div>
                    <div class="summary-value"
                         th:text="${totalShowtimes}">
                    </div>
                </div>
                <div class="summary-icon">
                    <i class="fa-solid fa-calendar-days"></i>
                </div>
            </div>
        </div>

        <!-- Tổng vé / Tổng ghế -->
        <div class="col-lg-4 col-md-12">
            <div class="summary-card">
                <div class="summary-content">
                    <div class="summary-label">Tổng vé đã bán / Tổng ghế</div>
                    <div class="summary-value">
                        <span th:text="${totalTickets}"></span>
                        <span class="summary-divider">/</span>
                        <span th:text="${totalSeats}"></span>
                    </div>
                    <div class="summary-note">
                    <span th:text="${
                        totalSeats > 0
                        ? #numbers.formatDecimal(
                            totalTickets * 100.0 / totalSeats,
                            1, 'COMMA', 1, 'POINT'
                          ) + '% lấp đầy'
                        : 'Chưa có ghế khả dụng'
                    }"></span>
                    </div>
                </div>
                <div class="summary-icon">
                    <i class="fa-solid fa-chair"></i>
                </div>
            </div>
        </div>

    </div>
    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <h5 class="fw-bold mb-3">Danh sách phim</h5>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>STT</th>
                        <th>Phim</th>
                        <th>Trạng thái</th>
                        <th class="text-end">
                            <a class="sort-link"
                               th:classappend="${sortBy == 'showtimes' ? ' active' : ''}"
                               th:href="@{/admin/revenue(
       branchId=${selectedBranchId},
       movieName=${movieName},
       movieStatus=${movieStatus},
       startDate=${startDate},
       endDate=${endDate},
       sortBy='showtimes',
       sortDir=${sortBy == 'showtimes' and sortDir == 'asc' ? 'desc' : 'asc'},
       page=0
   )}">
                                Số suất chiếu
                                <i class="fa-solid"
                                   th:classappend="${sortBy == 'showtimes' and sortDir == 'desc' ? ' fa-sort-down' : (sortBy == 'showtimes' ? ' fa-sort-up' : ' fa-sort')}"></i>
                            </a>
                        </th>
                        <th class="text-end">Vé đã bán / Tổng ghế</th>
                        <th class="text-end">
                            <a class="sort-link"
                               th:classappend="${sortBy == 'revenue' ? ' active' : ''}"
                               th:href="@{/admin/revenue(
       branchId=${selectedBranchId},
       movieName=${movieName},
       movieStatus=${movieStatus},
       startDate=${startDate},
       endDate=${endDate},
       sortBy='revenue',
       sortDir=${sortBy == 'revenue' and sortDir == 'asc' ? 'desc' : 'asc'},
       page=0
   )}">
                                Doanh thu vé
                                <i class="fa-solid"
                                   th:classappend="${sortBy == 'revenue' and sortDir == 'desc' ? ' fa-sort-down' : (sortBy == 'revenue' ? ' fa-sort-up' : ' fa-sort')}"></i>
                            </a>
                        </th>
                        <th></th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="movie, stat : ${items}">
                        <td th:text="${stat.count}"></td>
                        <td>
                            <div class="d-flex align-items-center gap-3">
                                <img th:if="${movie.posterUrl != null
                                              and !movie.posterUrl.isBlank()}"
                                     th:src="${movie.posterUrl}"
                                     alt="Poster"
                                     style="width:48px;height:68px;object-fit:cover;border-radius:6px">

                                <div>
                                    <div class="fw-semibold"
                                         th:text="${movie.movieTitle}"></div>
                                </div>
                            </div>
                        </td>
                        <td>
                            <span class="movie-status-badge"
                                  th:classappend="${movie.status.name() == 'NOW_SHOWING' ? ' status-now-showing' :
                                      (movie.status.name() == 'COMING_SOON' ? ' status-coming-soon' :
                                      (movie.status.name() == 'ENDED' ? ' status-ended' : ' status-stopped'))}"
                                  th:text="${movie.status.name() == 'NOW_SHOWING' ? 'Đang chiếu' :
                                      (movie.status.name() == 'COMING_SOON' ? 'Sắp chiếu' :
                                      (movie.status.name() == 'ENDED' ? 'Đã kết thúc' : 'Đã dừng'))}">
                            </span>
                        </td>
                        <td class="text-end" th:text="${movie.showtimeCount}"></td>
                        <td class="text-end">
                            <span th:text="${movie.ticketCount}"></span>/<span th:text="${movie.totalSeats}"></span>
                        </td>
                        <td class="text-end fw-semibold"
                            th:text="${#numbers.formatDecimal(
                                movie.revenue, 0, 'COMMA', 0, 'POINT') + ' ₫'}">
                        </td>
                        <td class="text-end">
                            <a class="btn-view-showtimes"
                               th:href="@{/admin/revenue/movie/{id}(
                                   id=${movie.movieId},
                                   startDate=${startDate},
                                   endDate=${endDate})}">
                                Xem suất chiếu
                                <i class="fa-solid fa-arrow-right ms-1"></i>
                            </a>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(items)}">
                        <td colspan="7" class="text-center text-secondary py-5">
                            Không có dữ liệu phim trong khoảng thời gian này.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mt-3">

<span class="text-secondary small"
      th:text="|Hiển thị ${totalRows == 0 ? 0 : currentPage * pageSize + 1}–${currentPage * pageSize + items.size()} / ${totalRows} phim|">
</span>

                <nav th:if="${totalPages > 1}" aria-label="Phân trang phim">
                    <ul class="pagination mb-0">

                        <li class="page-item"
                            th:classappend="${currentPage == 0 ? ' disabled' : ''}">
                            <a class="page-link"
                               th:href="@{/admin/revenue(
                       branchId=${selectedBranchId},
                       movieName=${movieName},
                       movieStatus=${movieStatus},
                       startDate=${startDate},
                       endDate=${endDate},
                       sortBy=${sortBy},
                       sortDir=${sortDir},
                       page=${currentPage - 1}
                   )}">Trước</a>
                        </li>

                        <li class="page-item"
                            th:each="p : ${#numbers.sequence(0, totalPages - 1)}"
                            th:classappend="${p == currentPage ? ' active' : ''}">
                            <a class="page-link"
                               th:href="@{/admin/revenue(
                       branchId=${selectedBranchId},
                       movieName=${movieName},
                       movieStatus=${movieStatus},
                       startDate=${startDate},
                       endDate=${endDate},
                       sortBy=${sortBy},
                       sortDir=${sortDir},
                       page=${p}
                   )}"
                               th:text="${p + 1}"></a>
                        </li>

                        <li class="page-item"
                            th:classappend="${currentPage >= totalPages - 1 ? ' disabled' : ''}">
                            <a class="page-link"
                               th:href="@{/admin/revenue(
                       branchId=${selectedBranchId},
                       movieName=${movieName},
                       movieStatus=${movieStatus},
                       startDate=${startDate},
                       endDate=${endDate},
                       sortBy=${sortBy},
                       sortDir=${sortDir},
                       page=${currentPage + 1}
                   )}">Sau</a>
                        </li>

                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>
<th:block id="actorJs"></th:block>

</body>
</html>
