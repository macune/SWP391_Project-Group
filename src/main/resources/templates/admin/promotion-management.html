<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: master(
          title = ~{::title},
          sidebar = ~{layout/sidebar :: admin-sidebar},
          content = ~{::#page-content},
          actorCss = ~{::#dummy-css},
          actorJs = ~{::#dummy-js}
      )}">
<head>
    <title>Quản lý Khuyến Mãi | System Admin</title>
</head>
<body>

<div id="page-content" class="container-fluid">
    <h4 class="mb-4 fw-bold text-cine-primary">Quản Lý Khuyến Mãi</h4>

    <!-- Hiển thị thông báo thành công hoặc lỗi -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row">
        <!-- Form Thêm mới / Cập nhật -->
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-cine-hot text-white">
                    <h6 class="mb-0">Thêm / Cập nhật Khuyến mãi</h6>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/promotions/save}" th:object="${coupon}" method="post">

                        <!-- TRƯỜNG ẨN: Cực kỳ quan trọng để Spring Boot phân biệt là Thêm Mới hay Cập Nhật -->
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label">Mã Code <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{code}" required placeholder="VD: CINEFLOW20">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phần trăm giảm (%) <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" th:field="*{discountPercentage}" required min="1" max="100">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Giảm tối đa (VNĐ)</label>
                            <input type="number" class="form-control" th:field="*{maxDiscountAmount}" placeholder="Để trống nếu không giới hạn">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ngày hết hạn <span class="text-danger">*</span></label>
                            <input type="datetime-local" class="form-control" th:field="*{expiryDate}" required>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" th:field="*{isActive}">
                            <label class="form-check-label">Kích hoạt</label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Lưu thông tin</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Danh sách -->
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-0 table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>STT</th>
                            <th>Mã (Code)</th>
                            <th>% Giảm</th>
                            <th>Giảm tối đa (đ)</th>
                            <th>Ngày hết hạn</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="c, stat : ${coupons}">
                            <!-- STT tự động tăng -->
                            <td class="fw-bold text-muted" th:text="${stat.count}"></td>

                            <td class="fw-bold text-primary" th:text="${c.code}"></td>
                            <td th:text="${c.discountPercentage} + '%'"></td>
                            <td th:text="${c.maxDiscountAmount != null ? c.maxDiscountAmount : 'Không giới hạn'}"></td>
                            <td th:text="${#temporals.format(c.expiryDate, 'dd/MM/yyyy HH:mm')}"></td>
                            <td>
                                <span th:if="${c.isActive}" class="badge bg-success">Đang mở</span>
                                <span th:unless="${c.isActive}" class="badge bg-danger">Đã khóa</span>
                            </td>
                            <td>
                                <!-- Nút Xóa sử dụng ID khớp với Controller -->
                                <form th:action="@{/admin/promotions/delete/{id}(id=${c.id})}" method="post" class="d-inline" onsubmit="return confirm('Bạn có chắc muốn xóa mã khuyến mãi này?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Xóa</button>
                                </form>
                            </td>
                        </tr>
                        <!-- Hiển thị khi danh sách trống -->
                        <tr th:if="${#lists.isEmpty(coupons)}">
                            <td colspan="7" class="text-center py-4 text-muted">Chưa có mã khuyến mãi nào được tạo.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block id="dummy-css"></th:block>
<th:block id="dummy-js"></th:block>

</body>
</html>
