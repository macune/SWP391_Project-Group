<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: master(~{::title}, ~{::#sidebar}, ~{::#content}, ~{::#actorCss}, ~{::#actorJs})}">
<head>
    <title>Thêm Phim Mới | CineFlow Admin</title>
    <th:block id="actorCss">
        <link rel="stylesheet" th:href="@{/css/admin.css}">
    </th:block>
</head>
<body>
<!-- SIDEBAR -->
<th:block id="sidebar">
    <div th:replace="~{layout/sidebar :: admin-sidebar}"></div>
</th:block>

<!-- CONTENT -->
<div id="content" class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <!-- Nút quay lại -->
            <a th:href="@{/movies}" class="text-decoration-none mb-3 d-inline-block" style="color: #c95d63;">
                <i class="fa-solid fa-arrow-left me-2"></i>Quay lại danh sách
            </a>

            <!-- Form Card -->
            <div class="card shadow-sm border-0" style="background-color: #f7ede8;">
                <!-- Header màu Trắng -->
                <div class="card-header py-3 bg-white border-bottom">
                    <h4 class="mb-0 fw-bold" style="color: #c95d63;"><i class="fa-solid fa-film me-2"></i>Thêm Phim Mới</h4>
                </div>

                <div class="card-body p-4 text-dark">
                    <!-- KHỐI LỖI -->
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-4 shadow-sm" role="alert">
                        <i class="fa-solid fa-triangle-exclamation me-2"></i><span th:text="${errorMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <form th:action="@{/movies/add}" th:object="${movieRequest}" method="POST">

                        <div class="row mb-3">
                            <div class="col-md-8">
                                <label class="form-label fw-medium" style="color: #c95d63;">Tên phim <span class="text-danger">*</span></label>
                                <input type="text" class="form-control shadow-sm" th:field="*{title}" required />
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-medium" style="color: #c95d63;">Ngày khởi chiếu <span class="text-danger">*</span></label>
                                <!-- Đã thay đổi: Dùng name và ép định dạng th:value để giữ lại ngày khi có lỗi -->
                                <input type="date" class="form-control shadow-sm"
                                       id="releaseDate" name="releaseDate"
                                       th:value="${movieRequest.releaseDate != null ? #temporals.format(movieRequest.releaseDate, 'yyyy-MM-dd') : ''}"
                                       th:attr="min=${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"
                                       required />
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-5">
                                <label class="form-label fw-medium" style="color: #c95d63;">Thể loại <span class="text-danger">*</span></label>
                                <select class="form-select shadow-sm" th:field="*{genre}" required>
                                    <option value="" disabled selected>-- Chọn thể loại --</option>
                                    <option value="Hành động">Hành động</option>
                                    <option value="Hài hước">Hài hước</option>
                                    <option value="Tình cảm">Tình cảm</option>
                                    <option value="Kinh dị">Kinh dị</option>
                                    <option value="Hoạt hình">Hoạt hình</option>
                                    <option value="Khoa học viễn tưởng">Khoa học viễn tưởng</option>
                                    <option value="Tâm lý - Giật gân">Tâm lý - Giật gân</option>
                                    <option value="Phiêu lưu">Phiêu lưu</option>
                                    <option value="Tài liệu">Tài liệu</option>
                                </select>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label fw-medium" style="color: #c95d63;">Ngôn ngữ <span class="text-danger">*</span></label>
                                <select class="form-select shadow-sm" th:field="*{language}" required>
                                    <option value="" disabled selected>-- Chọn ngôn ngữ --</option>
                                    <option value="Tiếng Anh - Phụ đề">Tiếng Anh - Phụ đề VN</option>
                                    <option value="Tiếng Hàn - Phụ đề">Tiếng Hàn - Phụ đề VN</option>
                                    <option value="Tiếng Nhật - Phụ đề">Tiếng Nhật - Phụ đề VN</option>
                                    <option value="Tiếng Thái - Phụ đề">Tiếng Thái - Phụ đề VN</option>
                                    <option value="Tiếng Việt">Phim Tiếng Việt</option>
                                    <option value="Lồng tiếng">Lồng tiếng Tiếng Việt</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label fw-medium" style="color: #c95d63;">Thời lượng <span class="text-danger">*</span></label>
                                <div class="input-group shadow-sm">
                                    <input type="number" class="form-control" th:field="*{duration}" min="1" required />
                                    <span class="input-group-text bg-white">phút</span>
                                </div>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-medium" style="color: #c95d63;">Nhãn độ tuổi <span class="text-danger">*</span></label>
                                <select class="form-select shadow-sm" th:field="*{ageRating}">
                                    <option value="P">P - Phổ biến (Mọi độ tuổi)</option>
                                    <option value="T13">T13 - Khán giả từ 13 tuổi trở lên</option>
                                    <option value="T16">T16 - Khán giả từ 16 tuổi trở lên</option>
                                    <option value="T18">T18 - Khán giả từ 18 tuổi trở lên</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium" style="color: #c95d63;">Trạng thái <span class="text-danger">*</span></label>
                                <select class="form-select shadow-sm" th:field="*{status}">
                                    <option value="COMING_SOON">Sắp chiếu</option>
                                    <option value="NOW_SHOWING">Đang chiếu</option>
                                    <option value="ENDED">Ngừng chiếu</option>
                                </select>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-medium" style="color: #c95d63;">Link Ảnh Poster URL</label>
                                <input type="url" class="form-control shadow-sm" th:field="*{posterUrl}" />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium" style="color: #c95d63;">Link Trailer (Youtube)</label>
                                <input type="url" class="form-control shadow-sm" th:field="*{trailerUrl}" />
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-medium" style="color: #c95d63;">Mô tả tóm tắt nội dung</label>
                            <textarea class="form-control shadow-sm" th:field="*{description}" rows="5"></textarea>
                        </div>

                        <!-- CẢNH BÁO TRÙNG LẶP -->
                        <div th:if="${duplicateWarning}" class="alert alert-warning shadow-sm mt-4 mb-0" role="alert">
                            <h5 class="alert-heading text-dark fw-bold"><i class="fa-solid fa-triangle-exclamation me-2"></i>Phát hiện trùng lặp dữ liệu!</h5>
                            <p class="text-dark mb-3" th:text="${duplicateWarning}"></p>
                            <hr class="border-warning">
                            <div class="d-flex justify-content-end">
                                <a th:href="@{/movies}" class="btn btn-outline-dark me-2 px-4">Hủy bỏ</a>
                                <button type="submit" name="confirmDuplicate" value="true" class="btn btn-warning fw-bold text-dark px-4 shadow">
                                    <i class="fa-solid fa-check-double me-2"></i>Vẫn Thêm Phim
                                </button>
                            </div>
                        </div>

                        <div class="text-end pt-3 mt-4" style="border-top: 1px solid #c95d63;" th:if="${duplicateWarning == null}">
                            <a th:href="@{/movies}" class="btn btn-outline-secondary me-2 px-4">Hủy bỏ</a>
                            <button type="submit" class="btn text-white px-5 fw-bold shadow-sm" style="background-color: #c95d63;">
                                <i class="fa-solid fa-floppy-disk me-2"></i>Lưu Phim Mới
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block id="actorJs">
    <script th:src="@{/js/admin.js}"></script>
</th:block>
</body>
</html>
